# =============================================================================
# Example parameters — Structure Prediction Benchmark Pipeline v0.1.0
# FASTA INPUT MODE
# =============================================================================
# Usage:
#   sbatch /hpc-home/jowillia/receptor_design/structure-prediction-benchmark/run_benchmark.slurm.sh ./params_fasta.yml
#
# Required: input_fasta  (a 2-entry protein FASTA: receptor then effector)
# Optional: receptor_chain / effector_chain (synthetic chain labels, default A/B)
#           models (list of model names to run — defaults to all)
#
# NOTE: In FASTA mode there is no experimental reference structure, so
# compute_metrics.py skips structural RMSD/DockQ.  Confidence metrics
# (pLDDT, ipTM, pTM, etc.) are still computed and aggregated as normal.
# =============================================================================


# ── Project ───────────────────────────────────────────────────────────
project_name: "fasta_smoketest"
outdir: "./fasta_smoketest_results"


# ── FASTA input ───────────────────────────────────────────────────────
# A FASTA file containing exactly two protein entries.  The first entry is
# treated as the receptor, the second as the effector.  Headers can be
# anything; sequences must be standard amino-acid characters.
#
# Example my_pair.fasta:
#   >receptor_PikHMA
#   MKFLVNVALVFMVVYISYIYAD...
#   >effector_AVRPikD
#   MRTLLVSALCASLLATPGLGAP...
input_fasta: "./my_pair.fasta"

# Synthetic chain IDs assigned to the two FASTA entries.  These are just
# labels handed to the predictors (Boltz/Chai/AF3/etc.) — they do NOT need
# to match anything in a PDB file because there is no reference PDB in
# FASTA mode.  Defaults are A (receptor) and B (effector); override only
# if you have a downstream tool that expects different IDs.
# receptor_chain: "A"
# effector_chain: "B"


# ═════════════════════════════════════════════════════════════════════════
# MODEL SELECTION
# ═════════════════════════════════════════════════════════════════════════
# Same valid names as in PDB mode.  Note that *_constrained variants of
# Boltz1/Boltz2 derive their pocket constraints from the reference PDB and
# will therefore be uninformative in FASTA mode (they fall back to the
# placeholder reference) — comment them out for FASTA runs unless you
# specifically want to inspect that behaviour.
#
#   boltz1               boltz1_msa             boltz1_constrained
#   boltz2               boltz2_msa             boltz2_constrained
#   chai1                af2m
#   af3                  af3_nomsa
#   colabfold            colabfold_nomsa
#
models:
  - boltz1
  - boltz2
  - chai1
  - af2m
  - af3
  - colabfold


# ═════════════════════════════════════════════════════════════════════════
# INFRASTRUCTURE PATHS  (defaults match the NBI/JIC cluster layout)
# ═════════════════════════════════════════════════════════════════════════
# Override only if your containers/databases live elsewhere.
#
# benchmark_container: "/hpc-home/jowillia/singularity/Boltz1_Boltz2_Chai1_ColabFold/benchmark_models.img"
# colabfold_container: "/hpc-home/jowillia/singularity/ColabFold/colabfold.img"
# colabfold_db:        "/nbi/Reference-Data/AlphaFold/colabfold_databases"
# af2_data_dir:        "/nbi/Reference-Data/AlphaFold/db-v2.3.2"
# af3_db_v3:           "/nbi/Reference-Data/AlphaFold/db-v3.0.0"
# af3_model_dir:       "/hpc-home/jowillia/singularity/AlphaFold3"
# af2_package_id:      "be036146-04b2-42a1-b7f8-26af883f2281"
# af3_package_id:      "e8edb411-7374-4342-b9f1-408da41fc197"

# ── GPU concurrency ──────────────────────────────────────────────────────
# max_gpu_parallel: 1