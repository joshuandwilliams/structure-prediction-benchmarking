# Analysis environment for structure-prediction-benchmarking.
#
# This is the environment the Quarto documents under
# analysis/structure_prediction_benchmark/ render in, and the one the helper
# scripts in bin/ are run under off-cluster. It does NOT contain any structure
# predictor: Boltz-1/2, Chai-1, ColabFold and ESMFold2 run inside the
# Singularity images built from containers/*.def, and AlphaFold2-Multimer and
# AlphaFold 3 load from the HPC source-package system.
#
#   mamba env create -f environment.yml
#   mamba activate spb-analysis
#   cd analysis/structure_prediction_benchmark && quarto render
#
# Versions are pinned exactly so a re-render reproduces the committed figures.
# Note that matplotlib decides figure extents from font metrics, so a different
# matplotlib version shifts panel sizes by a pixel or two without changing any
# plotted value.

name: spb-analysis

channels:
  - conda-forge

dependencies:
  - python=3.11.15

  # Core analysis stack. Every .qmd uses these through _common.py.
  - numpy=2.4.6
  - pandas=3.0.5
  - matplotlib-base=3.11.1

  # Structure parsing. biopython is used by analyses 9 and 10; gemmi is used by
  # the mmCIF/PDB readers in bin/ (compute_metrics.py, extract_sequences.py).
  - biopython=1.88
  - gemmi=0.7.5

  # bin/validate_boltz_yaml.py and the Boltz input writers.
  - pyyaml=6.0.3

  # Quarto's python engine.
  - ipykernel=7.3.0
  - jupyter_core=5.9.1
  - nbformat=5.11.0
  - nbclient=0.11.0

  # Repo tooling (see [tool.pytest.ini_options] / [tool.ruff] in pyproject.toml).
  - pytest=9.1.1
  - ruff=0.16.2

  - pip
  - pip:
      # TM-align bindings for the HMA superposition in analyses 9 and 10.
      # Not packaged on conda-forge.
      - tmtools==0.3.0
