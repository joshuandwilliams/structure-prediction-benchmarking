# Example parameters. Copy alongside a reference PDB and submit with:
#   sbatch <repo>/run_benchmark.slurm.sh ./params.yml
#
# Required: reference_pdb, receptor_chain, effector_chain.

project_name: "6G10_benchmark"
outdir:       "./6G10_benchmark_results"

# A two-chain PDB holding the experimental coordinates of both partners.
# References built by scripts/extract_benchmark_complexes.py are always
# A = plant protein, B = pathogen effector.
reference_pdb:   "./6G10.pdb"
receptor_chain:  "A"
effector_chain:  "B"

# Omit to run all 16. The 13 template-free variants are the model comparison.
# The three *_template variants supply the reference effector as a structural
# template, so they are not comparable with the rest and exist only to pair
# with their template-free twins.
#
#   boltz1            boltz1_msa            boltz1_constrained
#   boltz2            boltz2_msa            boltz2_constrained
#   chai1             af2m
#   af3               af3_nomsa
#   colabfold         colabfold_nomsa
#   esmfold2
#   boltz2_template   boltz2_msa_template   boltz2_constrained_template
#
# Any of boltz1_msa, boltz2_msa, boltz2_msa_template or colabfold triggers the
# shared COLABFOLD_SEARCH, run once and reused. Either af3 variant triggers
# AF3_SETUP_DB. esmfold2 needs a 40 GB GPU.
models:
  - boltz1
  - boltz1_msa
  - boltz1_constrained
  - boltz2
  - boltz2_msa
  - boltz2_constrained
  - chai1
  - af2m
  - af3
  - af3_nomsa
  - colabfold
  - colabfold_nomsa
  - esmfold2

# Infrastructure paths default to the NBI cluster layout. Override only if
# containers or databases live elsewhere.
#
# benchmark_container: "/hpc-home/jowillia/singularity/Boltz1_Boltz2_Chai1_ColabFold/Boltz1_Boltz2_Chai1.img"
# colabfold_container: "/hpc-home/jowillia/singularity/ColabFold/colabfold.img"
# esmfold2_container:  "/hpc-home/jowillia/singularity/ESMFold2/esmfold2.img"
# colabfold_db:        "/nbi/Reference-Data/AlphaFold/colabfold_databases"
# af2_data_dir:        "/nbi/Reference-Data/AlphaFold/db-v2.3.2"
# af3_db_v3:           "/nbi/Reference-Data/AlphaFold/db-v3.0.0"
# af3_model_dir:       "/hpc-home/jowillia/singularity/AlphaFold3"
# af3_db_dir:          "/hpc-home/jowillia/singularity/AlphaFold3/af3_db"
# af2_package_id:      "be036146-04b2-42a1-b7f8-26af883f2281"
# af3_package_id:      "e8edb411-7374-4342-b9f1-408da41fc197"

# GPU jobs of any one model allowed at once. The jic-gpu queue is small, so 1
# is usually right. Different models still run in parallel.
# max_gpu_parallel: 1
