name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Pinned rather than floating. An unpinned ruff picks up new default rules
      # on release and fails CI on code that passed locally.
      - name: Install ruff
        run: pip install "ruff==0.15.21"

      # Configuration lives in pyproject under [tool.ruff]. Line length 100,
      # PEP 8 (E, W) and PEP 257 (D, minus D1xx).
      #
      # `ruff format --check` is deliberately not run. The repo aligns related
      # values into columns (MODEL_MAP, the params files, fixture tables) and
      # the formatter collapses that alignment, which costs more in readability
      # than it gains in consistency. Linting is enforced, formatting is not.
      - name: ruff check
        run: ruff check .
