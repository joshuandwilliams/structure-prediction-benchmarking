# =============================================================================
# Tier 1: HMA integrated domain / MAX effector complexes
# Run 2 — effector-template arms (Tier 1, 6FU9)
# =============================================================================
# The three Boltz-2 variants re-run with the effector chain of the reference
# complex supplied as a structural template (force: true, threshold 1.0,
# enforced by --use_potentials), matching what the structure-negative-steering
# engine gives Boltz-2.
#
# NOT part of the model comparison. Each arm pairs with its template-free twin
# in Run 1 (boltz2, boltz2_msa, boltz2_constrained), differing in nothing but
# the supplied effector fold, so the pair measures what that fold is worth.
#
# Run from the SAME directory as Run 1 with -resume so the shared
# COLABFOLD_SEARCH result is reused rather than recomputed (~34 min/target):
#   sbatch run_benchmark.slurm.sh ./params_template.yml
# =============================================================================

project_name: "6FU9_template"
outdir:       "./6FU9_template_results"

reference_pdb:   "./6FU9.pdb"
receptor_chain:  "A"
effector_chain:  "B"

models:
  - boltz2_template
  - boltz2_msa_template
  - boltz2_constrained_template
