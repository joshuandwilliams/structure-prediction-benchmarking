# =============================================================================
# Structure Prediction Benchmark — FASTA mode
# Pikp-1 HMA  ×  AVR-PikF
# =============================================================================
# Receptor: Pikp-1 HMA domain   (78 aa, from Pikp-1_HMA.pdb chain A)
# Effector: AVR-PikF            (81 aa, from AVR-PikF.pdb chain B)
#
# FASTA mode: no experimental reference complex is supplied, so structural
# RMSD/DockQ are skipped.  Confidence metrics (pLDDT, ipTM, pTM, ...) are
# computed and aggregated as normal.
# =============================================================================


# ── Project ───────────────────────────────────────────────────────────
project_name: "pikp1_hma_avrpikf"
outdir: "./pikp1_hma_avrpikf_results"


# ── FASTA input ───────────────────────────────────────────────────────
# Two-entry FASTA: entry 1 = receptor (Pikp-1 HMA), entry 2 = effector (AVR-PikF).
input_fasta: "./Pikp1_HMA__AVR_PikF.fasta"

# Synthetic chain IDs handed to the predictors.  Defaults are A/B; left
# explicit here for clarity.
receptor_chain: "A"
effector_chain: "B"


# ═════════════════════════════════════════════════════════════════════════
# MODEL SELECTION
# ═════════════════════════════════════════════════════════════════════════
# *_constrained Boltz variants derive pocket constraints from a reference
# PDB and are uninformative in FASTA mode — omitted here.
models:
  - boltz1
  - boltz1_msa
  - boltz2
  - boltz2_msa
  - chai1
  - af2m
  - af3
  - af3_nomsa
  - colabfold
  - colabfold_nomsa


# ═════════════════════════════════════════════════════════════════════════
# INFRASTRUCTURE PATHS  (defaults match the NBI/JIC cluster layout)
# ═════════════════════════════════════════════════════════════════════════
# Override only if your containers/databases live elsewhere.
#
# benchmark_container: "/hpc-home/jowillia/singularity/Boltz1_Boltz2_Chai1_ColabFold/Boltz1_Boltz2_Chai1.img"
# colabfold_container: "/hpc-home/jowillia/singularity/ColabFold/colabfold.img"
# colabfold_db:        "/nbi/Reference-Data/AlphaFold/colabfold_databases"
# af2_data_dir:        "/nbi/Reference-Data/AlphaFold/db-v2.3.2"
# af3_db_v3:           "/nbi/Reference-Data/AlphaFold/db-v3.0.0"
# af3_model_dir:       "/hpc-home/jowillia/singularity/AlphaFold3"

# ── GPU concurrency ──────────────────────────────────────────────────────
# max_gpu_parallel: 1
