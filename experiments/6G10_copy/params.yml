# =============================================================================
# 6G10_copy benchmark — all 13 models
# Pik-1 HMA + AVR-PikD complex (Maqbool et al. 2015)
# A second run of the 6G10 target (separate output tree from experiments/6G10).
# =============================================================================


# ── Project ───────────────────────────────────────────────────────────
project_name: "6G10_copy_all_models"
outdir: "./6G10_copy_all_models_results"


# ── Reference complex ─────────────────────────────────────────────────
# 6G10 has three chains:
#   A — HMA domain copy 1 (crystal packing, not bound)
#   B — HMA domain copy 2 (bound to AVR-PikD — the biologically relevant one)
#   C — AVR-PikD effector
reference_pdb: "./6G10.pdb"
receptor_chain: "B"
effector_chain: "C"


# ── Models ────────────────────────────────────────────────────────────
# All 13 predictors. boltz1_msa / boltz2_msa / colabfold share the
# COLABFOLD_SEARCH step (runs once); af3 / af3_nomsa share AF3_SETUP_DB;
# esmfold2 is single-sequence (no MSA) and needs a 40 GB+ GPU.
models:
  - boltz1
  - boltz1_msa
  - boltz1_constrained
  - boltz2
  - boltz2_msa
  - boltz2_constrained
  - chai1
  - af2m
  - af3
  - af3_nomsa
  - colabfold
  - colabfold_nomsa
  - esmfold2
